<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a09">
<title>KUI — Music App</title>
<style>
/* ============================================================
   KUI · THEME TOKENS
   ============================================================ */
:root{
  --accent:#2ee59d;
  --accent-2:#1fc98a;
  --accent-soft:rgba(46,229,157,.13);
  --bg:#080a09;
  --bg-soft:#0d1110;
  --surface:#151a19;
  --surface-2:#1c2322;
  --surface-3:#252e2c;
  --border:rgba(255,255,255,.075);
  --text:#e9f2ee;
  --muted:#8b9a95;
  --danger:#ff6b6b;
  --radius:18px;
  --radius-sm:12px;
  --nav-h:62px;
  --player-h:68px;
  --sidebar-w:250px;
  --shadow:0 18px 40px rgba(0,0,0,.45);
}
body.light{
  --bg:#eef2f1;
  --bg-soft:#ffffff;
  --surface:#ffffff;
  --surface-2:#f4f7f6;
  --surface-3:#e5ebe9;
  --border:rgba(0,0,0,.08);
  --text:#0d1512;
  --muted:#63736e;
  --shadow:0 18px 40px rgba(0,0,0,.10);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',Arial,sans-serif;
  font-size:15px;line-height:1.45;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  transition:background .25s ease,color .25s ease;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;color:var(--muted);
  transition:background .18s,color .18s,transform .12s;flex:0 0 auto;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.is-fav{color:var(--accent)}
.icon-btn.is-on{color:var(--accent)}
.icon-btn.play{background:var(--accent);color:#04241a;width:42px;height:42px}
.icon-btn.play:hover{background:var(--accent-2);color:#04241a}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;
  transition:transform .12s,background .18s,opacity .18s;white-space:nowrap;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#04241a}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-danger{background:rgba(255,107,107,.14);color:var(--danger)}
.btn-danger:hover{background:rgba(255,107,107,.22)}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:13px}

.input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;outline:none;
  transition:border-color .18s,background .18s;
}
.input:focus{border-color:var(--accent)}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}

.sidebar{
  display:none;flex-direction:column;width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--bg-soft);border-right:1px solid var(--border);padding:18px 14px;
  gap:6px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand-mark{
  font-size:22px;font-weight:800;letter-spacing:2px;color:var(--accent);
}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-foot{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}

.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  color:var(--muted);font-weight:600;font-size:14px;transition:background .18s,color .18s;
  width:100%;text-align:left;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item .nav-badge{
  margin-left:auto;font-size:11px;background:var(--surface-3);color:var(--muted);
  border-radius:999px;padding:1px 7px;font-weight:700;
}

.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--bg);border-bottom:1px solid transparent;z-index:20;flex:0 0 auto;
}
.brand-mobile{font-size:19px;font-weight:800;letter-spacing:2px;color:var(--accent);flex:0 0 auto}
.search-pill{
  flex:1;display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:999px;padding:0 14px;height:42px;
  min-width:0;transition:border-color .18s;
}
.search-pill:focus-within{border-color:var(--accent)}
.search-pill svg{color:var(--muted);flex:0 0 auto}
.search-pill input{
  flex:1;min-width:0;background:none;border:0;outline:none;font-size:14px;
}
.search-pill input::placeholder{color:var(--muted)}
.avatar-btn{
  width:38px;height:38px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  color:var(--muted);border:1px solid var(--border);
}
.avatar-btn img{width:100%;height:100%;object-fit:cover}

/* VIEWS */
.views{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:6px 14px calc(var(--player-h) + var(--nav-h) + 30px);
  scroll-behavior:smooth;
}

/* ============================================================
   HOME / SECTIONS
   ============================================================ */
.hero{
  display:flex;flex-direction:column;gap:16px;
  background:linear-gradient(135deg,var(--accent-soft),transparent 62%);
  border:1px solid var(--border);border-radius:22px;padding:20px;margin-bottom:18px;
}
.hero-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.hero-title{font-size:28px;font-weight:800;letter-spacing:-.5px}
.hero-sub{color:var(--muted);font-size:14px;margin-top:6px;max-width:52ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:8px}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;display:flex;flex-direction:column;gap:6px;
}
.stat-card .sc-ico{color:var(--accent)}
.stat-card .sc-val{font-size:24px;font-weight:800;letter-spacing:-.5px}
.stat-card .sc-lbl{font-size:12px;color:var(--muted);font-weight:600}

.sec{margin-bottom:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-head h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.sec-link{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.sec-link:hover{color:var(--accent)}

.card-row{
  display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
}
.card-row::-webkit-scrollbar{height:6px}
.card{
  flex:0 0 148px;width:148px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;cursor:pointer;
  transition:transform .18s,background .18s,border-color .18s;scroll-snap-align:start;
  position:relative;
}
.card:hover{background:var(--surface-2);border-color:var(--accent);transform:translateY(-3px)}
.card-cover{border-radius:12px;overflow:hidden;margin-bottom:9px;aspect-ratio:1/1;position:relative}
.card-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tag{
  position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;backdrop-filter:blur(4px);
}

.cover{width:100%;height:100%;object-fit:cover;display:block}
.cover-fallback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--surface-3),var(--surface-2));color:var(--muted);
}
.cover-sm{width:46px;height:46px;border-radius:10px;flex:0 0 auto}

/* TRACK LIST */
.track-list{display:flex;flex-direction:column;gap:2px}
.track-row{
  display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:14px;
  cursor:pointer;transition:background .16s;position:relative;
}
.track-row:hover{background:var(--surface-2)}
.track-row.is-current{background:var(--accent-soft)}
.track-row.is-current .tr-name{color:var(--accent)}
.tr-rank{width:20px;text-align:center;font-size:13px;font-weight:800;color:var(--muted);flex:0 0 auto}
.tr-cover{position:relative;flex:0 0 auto;width:46px;height:46px}
.tr-meta{flex:1;min-width:0}
.tr-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.tr-name .tr-url-badge{
  display:inline-flex;flex:0 0 auto;color:var(--accent);opacity:.9;
}
.tr-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-dur{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.tr-tools{display:flex;align-items:center;gap:0;flex:0 0 auto}
.tr-tools .icon-btn{width:32px;height:32px}

.eq{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:12px;border-radius:10px}
.eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(1){height:8px;animation-delay:0s}
.eq i:nth-child(2){height:14px;animation-delay:.18s}
.eq i:nth-child(3){height:10px;animation-delay:.34s}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* EMPTY STATES */
.empty{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
  padding:34px 18px;background:var(--surface);border:1px dashed var(--border);
  border-radius:var(--radius);
}
.empty-ico{
  width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.empty h3{font-size:16px;font-weight:800}
.empty p{color:var(--muted);font-size:13.5px;max-width:34ch}
.empty-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.empty-sm{
  padding:20px;border-radius:var(--radius);background:var(--surface);
  border:1px dashed var(--border);color:var(--muted);font-size:13.5px;text-align:center;
}

/* PAGE HEAD */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.page-sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.page-head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* SEARCH */
.search-big{
  display:flex;align-items:center;gap:10px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:16px;padding:0 14px;height:50px;margin-bottom:18px;
}
.search-big:focus-within{border-color:var(--accent)}
.search-big svg{color:var(--muted);flex:0 0 auto}
.search-big input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{
  padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
  font-size:13px;font-weight:600;color:var(--muted);transition:all .18s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#04241a}

/* TAB BAR */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}

/* PLAYLIST GRID */
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pl-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px;cursor:pointer;transition:transform .18s,border-color .18s,background .18s;
}
.pl-card:hover{transform:translateY(-3px);border-color:var(--accent);background:var(--surface-2)}
.pl-card .card-cover{position:relative}

/* PLAYLIST DETAIL HEADER */
.pl-hero{display:flex;gap:16px;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap}
.pl-hero-cover{
  width:130px;height:130px;border-radius:16px;overflow:hidden;flex:0 0 auto;position:relative;
  background:linear-gradient(135deg,var(--surface-3),var(--surface-2));cursor:pointer;
}
.pl-hero-info{flex:1;min-width:180px}
.pl-hero-info h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;word-break:break-word}
.pl-hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* PROFILE */
.profile-head{display:flex;gap:16px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.profile-avatar{
  width:96px;height:96px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  color:var(--muted);position:relative;border:2px solid var(--border);cursor:pointer;
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-avatar .pa-edit{
  position:absolute;bottom:-2px;right:-2px;width:30px;height:30px;border-radius:50%;
  background:var(--accent);color:#04241a;display:flex;align-items:center;justify-content:center;
  border:3px solid var(--bg);
}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.form-hint{color:var(--muted);font-size:12.5px;line-height:1.55;margin-top:8px}

/* SETTINGS */
.set-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px 14px;margin-bottom:16px}
.set-group h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 0 8px;font-weight:800}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--border)}
.set-row:first-of-type{border-top:0}
.set-row .sr-title{font-size:14px;font-weight:600}
.set-row .sr-desc{font-size:12.5px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex:0 0 auto}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:all .18s}
.seg button.active{background:var(--accent);color:#04241a}

.switch{
  width:48px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;
  transition:background .2s;flex:0 0 auto;
}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:transform .2s;
}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}

/* ============================================================
   NAVIGATION
   ============================================================ */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);z-index:60;
  background:var(--bg);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;
  padding-bottom:env(safe-area-inset-bottom);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.02em;
  transition:color .18s;padding:6px 2px;
}
.bn-item.active{color:var(--accent)}
.bn-item:active{opacity:.7}

/* ============================================================
   MINI PLAYER
   ============================================================ */
.miniplayer{
  position:fixed;left:0;right:0;bottom:var(--nav-h);z-index:70;
  background:var(--surface);border-top:1px solid var(--border);
  transform:translateY(120%);transition:transform .3s cubic-bezier(.3,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.miniplayer.visible{transform:translateY(0)}
.mp-bar{height:3px;background:var(--surface-3);cursor:pointer;position:relative}
.mp-bar .bar-fill{height:100%;width:0;background:var(--accent);transition:width .12s linear}
.mp-inner{display:flex;align-items:center;gap:10px;padding:8px 12px;height:calc(var(--player-h) - 3px)}
.mp-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.mp-meta{min-width:0}
.mp-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-controls{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.mp-right{display:none;align-items:center;gap:10px;flex:1;justify-content:flex-end;min-width:0}
.time{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.bar{height:5px;background:var(--surface-3);border-radius:99px;flex:1;min-width:60px;cursor:pointer;position:relative}
.bar .bar-fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .1s linear}
.vol{width:80px;accent-color:var(--accent);flex:0 0 auto}

/* ============================================================
   FULL PLAYER
   ============================================================ */
.fullplayer{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  transform:translateY(100%);transition:transform .34s cubic-bezier(.3,.9,.3,1);
  display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  overflow-y:auto;
}
.fullplayer.open{transform:translateY(0)}
.fp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
.fp-head .fp-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fp-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:16px 0;max-width:520px;width:100%;margin:0 auto}
.fp-cover{
  width:100%;max-width:340px;aspect-ratio:1/1;margin:0 auto;border-radius:24px;
  overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(135deg,var(--surface-3),var(--surface-2));
}
.fp-titles{text-align:center}
.fp-titles h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:5px;word-break:break-word}
.fp-titles p{color:var(--muted);font-size:14px}
.fp-progress{display:flex;align-items:center;gap:10px}
.fp-progress .bar{height:6px}
.fp-controls{display:flex;align-items:center;justify-content:center;gap:14px}
.fp-controls .icon-btn{width:52px;height:52px}
.fp-controls .icon-btn.play{width:68px;height:68px}
.fp-controls .icon-btn.play svg{width:28px;height:28px}
.fp-volume{display:flex;align-items:center;gap:10px;max-width:300px;width:100%;margin:0 auto}
.fp-volume .vol{flex:1;width:auto}

/* ============================================================
   MODAL
   ============================================================ */
#modalRoot{position:fixed;inset:0;z-index:300;pointer-events:none}
#modalRoot.open{pointer-events:auto}
.modal-backdrop{
  position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease;
}
@media(min-width:640px){.modal-backdrop{align-items:center}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);
  border-radius:22px 22px 0 0;padding:20px;max-height:86vh;overflow-y:auto;
  animation:slideUp .26s cubic-bezier(.3,.9,.3,1);
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
@media(min-width:640px){.modal{border-radius:22px;margin:20px;padding-bottom:20px}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:17px;font-weight:800;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal-list{display:flex;flex-direction:column;gap:4px;margin:6px 0;max-height:50vh;overflow-y:auto}
.modal-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
  text-align:left;width:100%;transition:background .16s;font-size:14px;font-weight:600;
}
.modal-item:hover{background:var(--surface-2)}
.modal-item.danger{color:var(--danger)}
.modal-item .mi-ico{color:var(--muted);flex:0 0 auto}
.modal-item.danger .mi-ico{color:var(--danger)}
.modal-track{display:flex;align-items:center;gap:12px;margin-bottom:12px}

/* TOAST */
.toast-root{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + var(--player-h) + 20px);
  z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:calc(100% - 32px);max-width:420px;
}
.toast{
  background:var(--surface-3);color:var(--text);border:1px solid var(--border);
  padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);animation:toastIn .25s ease;max-width:100%;
}
.toast.error{background:rgba(255,107,107,.16);border-color:rgba(255,107,107,.35);color:#ffb3b3}
.toast.success{background:rgba(46,229,157,.14);border-color:rgba(46,229,157,.35);color:var(--accent)}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(min-width:600px){
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .hero{flex-direction:row;align-items:center;justify-content:space-between}

}
@media(min-width:760px){

}

  .views{padding-left:26px;padding-right:26px}
  .page-head h1{font-size:28px}

}

function icon(name, size){
  size = size || 20;
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" ' +
    'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    (ICON_PATHS[name] || '') + '</svg>';
}

/* ============================================================
   2. HELPERS
   ============================================================ */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function fmtTime(sec){
  sec = Number(sec);
  if(!isFinite(sec) || sec < 0) sec = 0;
  var m = Math.floor(sec / 60);
  var s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function fmtDate(ts){
  try{
    return new Date(ts).toLocaleString('ru-RU', {
      day:'2-digit', month:'2-digit', year:'2-digit',
      hour:'2-digit', minute:'2-digit'
    });
  }catch(e){ return ''; }
}
function plural(n, one, few, many){
  var m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }

/* ============================================================
   3. STORAGE (localStorage)
   ============================================================ */
const LS_KEY = 'kui_state_v1';

function defaultState(){
  return {
    /* track: {id,name,artist,album,duration,cover,size,type,addedAt,url?} */
    tracks: [],
    playlists: [],
    favorites: [],
    history: [],
    queue: [],
    profile: { name:'Слушатель', avatar:'', genre:'' },
    settings: {
      theme:'dark',
      autoplay:true,
      shuffle:false,
      repeat:'off',
      volume:1
    },
    currentTrackId: null
  };
}

let state = defaultState();

function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    var def = defaultState();
    state = {
      tracks:      Array.isArray(parsed.tracks) ? parsed.tracks : def.tracks,
      playlists:   Array.isArray(parsed.playlists) ? parsed.playlists : def.playlists,
      favorites:   Array.isArray(parsed.favorites) ? parsed.favorites : def.favorites,
      history:     Array.isArray(parsed.history) ? parsed.history : def.history,
      queue:       Array.isArray(parsed.queue) ? parsed.queue : def.queue,
      profile:     Object.assign({}, def.profile, parsed.profile || {}),
      settings:    Object.assign({}, def.settings, parsed.settings || {}),
      currentTrackId: parsed.currentTrackId || null
    };
  }catch(e){
    console.warn('KUI: не удалось прочитать сохранённые данные', e);
    state = defaultState();
  }
}

let saveTimer = null;
function saveState(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    }catch(e){
      toast('Хранилище переполнено. Удалите часть треков или обложек.', 'error');
      console.warn('KUI: ошибка сохранения', e);
    }
  }, 120);
}
function saveStateNow(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

/* ============================================================
   4. IDB — локальное хранилище аудиофайлов (Blob)
   ============================================================ */
const DB_NAME = 'kui_audio_db';
const DB_STORE = 'files';
let idbOk = true;
const memFiles = new Map();

function openDB(){
  return new Promise(function(resolve, reject){
    if(!('indexedDB' in window)){ reject(new Error('no-idb')); return; }
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(){
      if(!req.result.objectStoreNames.contains(DB_STORE)){
        req.result.createObjectStore(DB_STORE);
      }
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbPut(key, blob){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(blob, key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbGet(key){
  return openDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(DB_STORE, 'readonly');
      var rq = tx.objectStore(DB_STORE).get(key);
      rq.onsuccess = function(){ resolve(rq.result); };
      rq.onerror = function(){ reject(rq.error); };
    });
  });
}
function idbDel(key){
  return openDB().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ resolve(false); };
    });
  });
}
function idbClear(){
  return openDB().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).clear();
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ resolve(false); };
    });
  });
}

async function filePut(key, blob){
  if(idbOk){
    try{ await idbPut(key, blob); return; }
    catch(e){
      idbOk = false;
      toast('Браузер ограничил локальное хранилище. Файлы доступны только до перезагрузки.', 'error');
    }
  }
  memFiles.set(key, blob);
}
async function fileGet(key){
  if(memFiles.has(key)) return memFiles.get(key);
  if(idbOk){
    try{ return await idbGet(key); }catch(e){ return null; }
  }
  return null;
}
async function fileDel(key){
  memFiles.delete(key);
  if(idbOk){ try{ await idbDel(key); }catch(e){} }
}
async function fileClear(){
  memFiles.clear();
  if(idbOk){ try{ await idbClear(); }catch(e){} }
}

/* ============================================================
   7. TOAST
   ============================================================ */
function toast(message, type){
  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = message;
  toastRoot.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(function(){ el.remove(); }, 260);
  }, 2800);
}

/* ============================================================
   8. MODALS
   ============================================================ */
function openModal(innerHTML, opts){
  opts = opts || {};
  modalRoot.innerHTML =
    '<div class="modal-backdrop" data-backdrop>' +
      '<div class="modal" role="dialog">' + innerHTML + '</div>' +
    '</div>';
  modalRoot.classList.add('open');
  var backdrop = modalRoot.querySelector('[data-backdrop]');
  backdrop.addEventListener('click', function(e){
    if(e.target === backdrop && !opts.persistent){
      closeModal();
      if(opts.onCancel) opts.onCancel();
    }
  });
}
function closeModal(){
  modalRoot.innerHTML = '';
  modalRoot.classList.remove('open');
}

function promptDialog(title, value, placeholder, okLabel){
  return new Promise(function(resolve){
    openModal(
      '<h3 class="modal-title">' + esc(title) + '</h3>' +
      '<input class="input" id="modalInput" value="' + esc(value || '') + '" placeholder="' + esc(placeholder || '') + '">' +
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" id="modalCancel">Отмена</button>' +
        '<button class="btn btn-primary" id="modalOk">' + esc(okLabel || 'Сохранить') + '</button>' +
      '</div>',
      { onCancel: function(){ resolve(null); } }
    );
    var input = document.getElementById('modalInput');
    var done = false;
    function finish(val){ if(done) return; done = true; closeModal(); resolve(val); }
    document.getElementById('modalOk').onclick = function(){
      var v = input.value.trim();
      finish(v ? v : null);
    };
    document.getElementById('modalCancel').onclick = function(){ finish(null); };
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('modalOk').click(); }
      if(e.key === 'Escape'){ finish(null); }
    });
    setTimeout(function(){ input.focus(); input.select(); }, 60);
  });
}

function confirmDialog(title, text, okLabel, danger){
  return new Promise(function(resolve){
    openModal(
      '<h3 class="modal-title">' + esc(title) + '</h3>' +
      '<p style="color:var(--muted);font-size:14px;margin-bottom:4px">' + esc(text) + '</p>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" id="modalCancel">Отмена</button>' +
        '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" id="modalOk">' + esc(okLabel || 'Подтвердить') + '</button>' +
      '</div>',
      { onCancel: function(){ resolve(false); } }
    );
    var done = false;
    function finish(v){ if(done) return; done = true; closeModal(); resolve(v); }
    document.getElementById('modalOk').onclick = function(){ finish(true); };
    document.getElementById('modalCancel').onclick = function(){ finish(false); };
  });
}

/* ============================================================
   9. AUDIO ENGINE
   ============================================================ */
const audio = new Audio();
audio.preload = 'metadata';
audio.volume = state.settings.volume;

audio.addEventListener('timeupdate', updateProgressUI);
audio.addEventListener('durationchange', updateProgressUI);
audio.addEventListener('loadedmetadata', function(){
  var t = getTrack(state.currentTrackId);
  if(!t) return;
  if(isFinite(audio.duration) && audio.duration > 0 && Math.abs((t.duration || 0) - audio.duration) > 1){
    t.duration = audio.duration;
    saveState();
  }
  updateProgressUI();
});
audio.addEventListener('play', function(){
  state.isPlaying = true;
  renderMiniPlayer();
  renderFullPlayer();
  updateRowHighlights();
});
audio.addEventListener('pause', function(){
  state.isPlaying = false;
  renderMiniPlayer();
  renderFullPlayer();
  updateRowHighlights();
});
audio.addEventListener('ended', onTrackEnded);
audio.addEventListener('error', function(){
  if(!audio.src) return;
  toast('Не удалось воспроизвести файл. Возможно, он повреждён или формат не поддерживается.', 'error');
  state.isPlaying = false;
  renderMiniPlayer();
  renderFullPlayer();
});

function getTrack(id){
  if(!id) return null;
  for(var i = 0; i < state.tracks.length; i++){
    if(state.tracks[i].id === id) return state.tracks[i];
  }
  return null;
}

/* --- Контекст воспроизведения --- */
function getContextList(key){
  if(!key) return state.tracks.map(function(t){ return t.id; });
  if(key.indexOf('playlist:') === 0){
    var pid = key.slice(9);
    var pl = state.playlists.find(function(p){ return p.id === pid; });
    return pl ? pl.trackIds.filter(function(id){ return !!getTrack(id); }) : [];
  }
  if(key.indexOf('artist:') === 0){
    var a = key.slice(7);
    return state.tracks.filter(function(t){ return (t.artist || 'Неизвестный исполнитель') === a; })
      .map(function(t){ return t.id; });
  }
  if(key.indexOf('album:') === 0){
    var al = key.slice(6);
    return state.tracks.filter(function(t){ return (t.album || 'Без альбома') === al; })
      .map(function(t){ return t.id; });
  }
  if(key === 'fav')    return state.favorites.filter(function(id){ return !!getTrack(id); });
  if(key === 'search') return searchTracks(ui.searchQuery).map(function(t){ return t.id; });
  if(key === 'recent') return recentTracks(60).map(function(t){ return t.id; });
  if(key === 'top')    return topTracks(60).map(function(t){ return t.id; });
  return state.tracks.map(function(t){ return t.id; });
}

/* --- Загрузка трека в плеер --- */
async function loadTrack(id, autoplay){
  var track = getTrack(id);
  if(!track){ toast('Трек не найден', 'error'); return; }

  /* --- Вариант A: онлайн-трек (стрим) --- */
  if(track.url){
    if(currentObjectUrl){
      try{ URL.revokeObjectURL(currentObjectUrl); }catch(e){}
      currentObjectUrl = null;
    }
    audio.src = track.url;   // браузер подгружает по частям
  }
  /* --- Вариант B: локальный файл из IndexedDB --- */
  else{
    var blob;
    try{ blob = await fileGet(id); }
    catch(e){ blob = null; }

    if(!blob){
      toast('Аудиофайл не найден в локальном хранилище. Добавьте его заново.', 'error');
      return;
    }
    if(currentObjectUrl){
      try{ URL.revokeObjectURL(currentObjectUrl); }catch(e){}
      currentObjectUrl = null;
    }
    currentObjectUrl = URL.createObjectURL(blob);
    audio.src = currentObjectUrl;
  }

  state.currentTrackId = id;
  state.isPlaying = false;
  saveState();
  addToHistory(id);

  renderMiniPlayer();
  renderFullPlayer();
  updateRowHighlights();

  if(autoplay){
    try{
      await audio.play();
    }catch(err){
      toast('Воспроизведение заблокировано браузером. Нажмите Play.', 'error');
    }
  }
  updateProgressUI();
}

function playTrackById(id, ctxKey){
  if(state.currentTrackId === id && audio.src){
    togglePlay();
    return;
  }
  var list = getContextList(ctxKey);
  if(list.indexOf(id) === -1) list = [id].concat(list);
  playContext = list;
  playIndex = list.indexOf(id);
  loadTrack(id, true);
}

function togglePlay(){
  if(!state.currentTrackId){
    if(state.tracks.length) playTrackById(state.tracks[0].id, 'all');
    return;
  }
  if(!audio.src){ loadTrack(state.currentTrackId, true); return; }
  if(audio.paused){
    audio.play().catch(function(){
      toast('Не удалось запустить воспроизведение', 'error');
    });
  }else{
    audio.pause();
  }
}

function nextTrack(auto){
  if(state.queue.length){
    var qid = state.queue.shift();
    saveState();
    if(!playContext.length) playContext = [qid];
    playIndex = playContext.indexOf(qid);
    loadTrack(qid, true);
    renderView();
    return;
  }
  if(!playContext.length){
    playContext = state.tracks.map(function(t){ return t.id; });
  }
  if(!playContext.length) return;

  if(state.settings.shuffle && playContext.length > 1){
    var idx = playIndex;
    var guard = 0;
    while(idx === playIndex && guard < 40){ idx = Math.floor(Math.random() * playContext.length); guard++; }
    playIndex = idx;
    loadTrack(playContext[playIndex], true);
    return;
  }

  var next = playIndex + 1;
  if(next >= playContext.length){
    if(state.settings.repeat === 'all'){
      next = 0;
    }else if(auto){
      audio.pause();
      audio.currentTime = 0;
      return;
    }else{
      next = 0;
    }
  }
  playIndex = next;
  loadTrack(playContext[playIndex], true);
}

function prevTrack(){
  if(audio.currentTime > 3){
    audio.currentTime = 0;
    return;
  }
  if(!playContext.length){
    playContext = state.tracks.map(function(t){ return t.id; });
  }
  if(!playContext.length) return;
  var prev = playIndex - 1;
  if(prev < 0) prev = playContext.length - 1;
  playIndex = prev;
  loadTrack(playContext[prev], true);
}

function onTrackEnded(){
  if(state.settings.repeat === 'one'){
    audio.currentTime = 0;
    audio.play().catch(function(){});
    return;
  }
  if(!state.settings.autoplay){
    state.isPlaying = false;
    renderMiniPlayer();
    renderFullPlayer();
    return;
  }
  nextTrack(true);
}

function setVolume(v){
  v = clamp(v, 0, 1);
  state.settings.volume = v;
  audio.volume = v;
  audio.muted = false;
  saveState();
  document.querySelectorAll('[data-volume]').forEach(function(el){
    if(parseFloat(el.value) !== v) el.value = v;
  });
  renderMiniPlayer();
  var volDesc = document.querySelector('.set-row .sr-title');
  viewRoot.querySelectorAll('.set-row').forEach(function(r){
    var t = r.querySelector('.sr-title');
    if(t && t.textContent === 'Громкость'){
      var d = r.querySelector('.sr-desc');
      if(d) d.textContent = Math.round(state.settings.volume * 100) + '%';
    }
  });
}

function updateProgressUI(){
  var t = getTrack(state.currentTrackId);
  var dur = audio.duration;
  if(!isFinite(dur) || dur <= 0) dur = (t && t.duration) || 0;
  var cur = audio.currentTime || 0;
  var p = dur > 0 ? clamp((cur / dur) * 100, 0, 100) : 0;

  document.querySelectorAll('[data-progress]').forEach(function(el){
    el.style.width = p + '%';
  });
  document.querySelectorAll('[data-curtime]').forEach(function(el){
    el.textContent = fmtTime(cur);
  });
  document.querySelectorAll('[data-durtime]').forEach(function(el){
    el.textContent = dur > 0 ? fmtTime(dur) : (t && t.url ? 'LIVE' : '0:00');
  });
}

/* --- Перемотка (pointer events) --- */
let seekEl = null;
function doSeek(e, el){
  var rect = el.getBoundingClientRect();
  if(!rect.width) return;
  var ratio = clamp((e.clientX - rect.left) / rect.width, 0, 1);
  var dur = audio.duration;
  if(isFinite(dur) && dur > 0){
    audio.currentTime = ratio * dur;
    updateProgressUI();
  }else{
    var t = getTrack(state.currentTrackId);
    if(t && t.duration){ audio.currentTime = ratio * t.duration; updateProgressUI(); }
  }
}
document.addEventListener('pointerdown', function(e){
  var el = e.target.closest ? e.target.closest('[data-seek]') : null;
  if(!el) return;
  seekEl = el;
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  doSeek(e, el);
});
document.addEventListener('pointermove', function(e){
  if(seekEl) doSeek(e, seekEl);
});
document.addEventListener('pointerup', function(){ seekEl = null; });
document.addEventListener('pointercancel', function(){ seekEl = null; });

/* ============================================================
   10. HISTORY
   ============================================================ */
function addToHistory(trackId){
  state.history.push({ id: trackId, at: Date.now() });
  if(state.history.length > 300) state.history = state.history.slice(-300);
  saveState();
}
function recentTracks(n){
  var seen = {}, out = [];
  for(var i = state.history.length - 1; i >= 0 && out.length < n; i--){
    var id = state.history[i].id;
    if(seen[id]) continue;
    seen[id] = 1;
    var t = getTrack(id);
    if(t) out.push(t);
  }
  return out;
}
function topTracks(n){
  var counts = {};
  state.history.forEach(function(h){
    counts[h.id] = (counts[h.id] || 0) + 1;
  });
  return Object.keys(counts)
    .sort(function(a, b){ return counts[b] - counts[a]; })
    .slice(0, n)
    .map(function(id){ return getTrack(id); })
    .filter(Boolean);
}

/* ============================================================
   11. LIBRARY / SEARCH
   ============================================================ */
function searchTracks(query){
  var q = (query || '').trim().toLowerCase();
  if(!q) return [];
  return state.tracks.filter(function(t){
    return (t.name || '').toLowerCase().indexOf(q) !== -1 ||
           (t.artist || '').toLowerCase().indexOf(q) !== -1 ||
           (t.album || '').toLowerCase().indexOf(q) !== -1;
  });
}

function sortedTracks(list, mode){
  var arr = list.slice();
  if(mode === 'name'){
    arr.sort(function(a, b){ return (a.name || '').localeCompare(b.name || '', 'ru'); });
  }else if(mode === 'artist'){
    arr.sort(function(a, b){
      var c = (a.artist || '').localeCompare(b.artist || '', 'ru');
      return c !== 0 ? c : (a.name || '').localeCompare(b.name || '', 'ru');
    });
  }else if(mode === 'duration'){
    arr.sort(function(a, b){ return (b.duration || 0) - (a.duration || 0); });
  }else{
    arr.sort(function(a, b){ return (b.addedAt || 0) - (a.addedAt || 0); });
  }
  return arr;
}

/* ============================================================
   12. COVER HELPERS
   ============================================================ */
function coverHTML(track, cls){
  cls = cls || '';
  if(track && track.cover){
    return '<img class="cover ' + cls + '" src="' + track.cover + '" alt="">';
  }
  return '<div class="cover cover-fallback ' + cls + '">' + icon('note', 20) + '</div>';
}
function resizeImage(file, max){
  max = max || 400;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#121614';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try{
          resolve(c.toDataURL('image/jpeg', 0.82));
        }catch(err){ reject(err); }
      };
      img.onerror = function(){ reject(new Error('image-decode')); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error('read')); };
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   13. UPLOAD AUDIO (локальные файлы)
   ============================================================ */
const SUPPORTED_EXT = ['mp3','wav','ogg','m4a','aac','opus','flac','webm','mp4'];

function fileExtension(name){
  var i = String(name).lastIndexOf('.');
  return i === -1 ? '' : name.slice(i + 1).toLowerCase();
}
function isProbablyAudio(file){
  var ext = fileExtension(file.name);
  if(SUPPORTED_EXT.indexOf(ext) !== -1) return true;
  return !!(file.type && file.type.indexOf('audio/') === 0);
}
function parseTrackName(filename){
  var base = String(filename).replace(/\.[^.]+$/, '').trim();
  var parts = base.split(' - ');
  if(parts.length >= 2 && parts[0].trim() && parts[1].trim()){
    return { artist: parts[0].trim(), name: parts.slice(1).join(' - ').trim() };
  }
  return { artist: 'Неизвестный исполнитель', name: base || filename };
}
function probeAudio(file){
  return new Promise(function(resolve){
    var url = URL.createObjectURL(file);
    var probe = new Audio();
    var settled = false;
    function done(ok, duration){
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      try{ URL.revokeObjectURL(url); }catch(e){}
      probe.src = '';
      resolve({ ok: ok, duration: duration || 0 });
    }
    var timer = setTimeout(function(){ done(false, 0); }, 12000);
    probe.preload = 'metadata';
    probe.onloadedmetadata = function(){
      var d = probe.duration;
      done(true, (isFinite(d) && d > 0) ? d : 0);
    };
    probe.onerror = function(){ done(false, 0); };
    probe.src = url;
    probe.load();
  });
}

async function handleAudioFiles(fileList){
  var files = Array.prototype.slice.call(fileList);
  if(!files.length) return;

  var added = 0, skipped = 0;
  toast('Обработка файлов…');

  for(var i = 0; i < files.length; i++){
    var file = files[i];

    if(!isProbablyAudio(file)){
      skipped++;
      toast('Неподдерживаемый формат: ' + file.name, 'error');
      continue;
    }

    var probe = await probeAudio(file);
    if(!probe.ok){
      skipped++;
      toast('Не удалось прочитать файл: ' + file.name, 'error');
      continue;
    }

    var meta = parseTrackName(file.name);
    var track = {
      id: uid(),
      name: meta.name,
      artist: meta.artist,
      album: '',
      duration: probe.duration,
      cover: '',
      size: file.size,
      type: file.type || '',
      addedAt: Date.now()
    };

    await filePut(track.id, file);
    state.tracks.push(track);
    added++;
  }

  saveStateNow();
  render();

  if(added){
    toast('Добавлено ' + added + ' ' + plural(added, 'трек', 'трека', 'треков'), 'success');
  }
  if(skipped && !added){
    toast('Не удалось добавить файлы. Проверьте формат.', 'error');
  }
}

/* ============================================================
   14. ONLINE TRACKS (URL)
   ============================================================ */
function probeUrl(url){
  return new Promise(function(resolve){
    var a = new Audio();
    var settled = false;
    var timer = setTimeout(function(){ done(false, 0); }, 12000);
    function done(ok, d){
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      a.src = '';
      resolve({ ok: ok, duration: d || 0 });
    }
    a.preload = 'metadata';
    /* ВАЖНО: не ставим crossOrigin — иначе часть серверов откажет */
    a.onloadedmetadata = function(){
      var d = a.duration;
      /* Infinity = живой стрим (радио). Это допустимо. */
      done(true, (isFinite(d) && d > 0) ? d : 0);
    };
    a.onerror = function(){ done(false, 0); };
    a.src = url;
  });
}

function guessNameFromUrl(url){
  try{
    var clean = url.split('?')[0].split('#')[0];
    var last = clean.split('/').pop() || '';
    last = decodeURIComponent(last).replace(/\.[a-z0-9]+$/i, '').trim();
    return last || '';
  }catch(e){ return ''; }
}

async function addTrackByUrl(rawUrl, name, artist){
  var url = String(rawUrl || '').trim();
  if(!/^https?:\/\//i.test(url)){
    toast('Ссылка должна начинаться с http:// или https://', 'error');
    return null;
  }

  /* Дубликаты по URL — не плодим одинаковые записи */
  var existing = state.tracks.find(function(t){ return t.url === url; });
  if(existing){
    toast('Этот трек уже есть в библиотеке');
    return existing;
  }

  var probe = await probeUrl(url);
  if(!probe.ok){
    toast('Не удалось открыть ссылку. Проверьте, что это прямой аудиофайл.', 'error');
    return null;
  }

  var guess = guessNameFromUrl(url);

  var track = {
    id: uid(),
    name: name || guess || 'Онлайн-трек',
    artist: artist || 'Онлайн-источник',
    album: '',
    duration: probe.duration,
    cover: '',
    size: 0,
    type: 'url',
    url: url,
    addedAt: Date.now()
  };

  state.tracks.push(track);
  saveStateNow();
  render();
  return track;
}

/* ============================================================
   15. RENDER · TRACK ROWS & CARDS
   ============================================================ */
function trackRowHTML(track, ctx, opts){

function trackCardHTML(track, ctx){
  var urlTag = track.url ? '<span class="card-tag">' + icon('globe', 11) + ' онлайн</span>' : '';
  return '' +
  '<div class="card" data-action="play-track" data-id="' + track.id + '" data-ctx="' + esc(ctx) + '">' +
    '<div class="card-cover">' + coverHTML(track) + urlTag + '</div>' +
    '<div class="card-title">' + esc(track.name) + '</div>' +
    '<div class="card-sub">' + esc(track.artist) + '</div>' +
  '</div>';

function playlistCardHTML(pl){
  var count = pl.trackIds.length;
  var inner = pl.cover
    ? '<img class="cover" src="' + pl.cover + '" alt="">'
    : '<div class="cover cover-fallback">' + icon('playlist', 26) + '</div>';

  '<div class="pl-card" data-action="open-playlist" data-id="' + pl.id + '">' +
    '<div class="card-cover">' + inner + '</div>' +

    '<div class="card-sub">' + count + ' ' + plural(count, 'трек', 'трека', 'треков') + '</div>' +
  '</div>';

function section(title, linkView, content, linkLabel){
  return '' +
  '<section class="sec">' +
    '<div class="sec-head">' +
      '<h2>' + esc(title) + '</h2>' +
      (linkView ? '<button class="sec-link" data-action="nav" data-view="' + linkView + '">' + esc(linkLabel || 'Все') + '</button>' : '') +
    '</div>' +
    content +
  '</section>';
}

function statCard(label, value, icoName){
  return '' +
  '<div class="stat-card">' +
    '<span class="sc-ico">' + icon(icoName, 20) + '</span>' +
    '<span class="sc-val">' + value + '</span>' +

}

    statCard('Избранное', favs.length, 'heart') +

      '<div class="card-row">' + state.playlists.map(playlistCardHTML).join('') + '</div>');

    favs.length
      ? '<div class="track-list">' + favs.slice(0, 6).map(function(t){ return trackRowHTML(t, 'fav'); }).join('') + '</div>'
      : '<div class="empty-sm">В избранном пока пусто. Нажимайте ♥ на треках, чтобы добавить их сюда.</div>');

  html += section('Все треки', 'library',
    hasTracks
      ? '<div class="track-list">' + sortedTracks(state.tracks, 'added').slice(0, 12).map(function(t){ return trackRowHTML(t, 'all'); }).join('') + '</div>'
      : '<div class="empty">' +
          '<div class="empty-ico">' + icon('note', 32) + '</div>' +
          '<h3>У вас пока нет музыки</h3>' +

        '</div>');

  if(top.length){

      '<div class="track-list">' + top.map(function(t, i){ return trackRowHTML(t, 'top', { rank: i + 1 }); }).join('') + '</div>');

/* ---------- SEARCH ---------- */
function searchResultsHTML(q){
  q = (q || '').trim();
  if(!q){
    return '<div class="empty-sm">Начните вводить название трека, исполнителя или альбома.</div>';
  }
  var found = searchTracks(q);
  if(!found.length){
    return '<div class="empty">' +
      '<div class="empty-ico">' + icon('search', 30) + '</div>' +
      '<h3>Ничего не найдено</h3>' +
      '<p>Попробуйте изменить запрос «' + esc(q) + '».</p>' +
    '</div>';
  }

  var artists = {}, albums = {};
  found.forEach(function(t){
    var a = t.artist || 'Неизвестный исполнитель';
    artists[a] = (artists[a] || 0) + 1;
    if(t.album) albums[t.album] = (albums[t.album] || 0) + 1;
  });

  var html = '';
  var artistKeys = Object.keys(artists);
  if(artistKeys.length){
    html += '<div class="sec-head" style="margin-top:4px"><h2>Исполнители</h2></div><div class="chip-row">' +
      artistKeys.map(function(a){
        return '<button class="chip" data-action="nav" data-view="collection" data-type="artist" data-value="' + esc(a) + '">' +
          esc(a) + ' · ' + artists[a] + '</button>';
      }).join('') + '</div>';
  }
  var albumKeys = Object.keys(albums);
  if(albumKeys.length){
    html += '<div class="sec-head"><h2>Альбомы</h2></div><div class="chip-row">' +
      albumKeys.map(function(a){
        return '<button class="chip" data-action="nav" data-view="collection" data-type="album" data-value="' + esc(a) + '">' +
          esc(a) + ' · ' + albums[a] + '</button>';
      }).join('') + '</div>';
  }

  html += '<div class="sec-head"><h2>Треки</h2><span class="sec-link">' + found.length + '</span></div>' +
    '<div class="track-list">' +
      found.map(function(t){ return trackRowHTML(t, 'search'); }).join('') +
    '</div>';

  return html;
}

function viewSearch(){
  return '' +
  '<div class="page-head"><h1>Поиск</h1></div>' +
  '<div class="search-big">' + icon('search', 20) +

  '</div>' +

}

  if(box) box.innerHTML = searchResultsHTML(ui.searchQuery);

/* ---------- LIBRARY ---------- */
function viewLibrary(){
  var tabs = [
    ['all', 'Все треки'],
    ['albums', 'Альбомы'],
    ['artists', 'Исполнители'],
    ['fav', 'Избранное'],
    ['playlists', 'Плейлисты']
  ];
  var tab = ui.libraryTab;

  var html = '' +
  '<div class="page-head">' +
    '<div><h1>Моя библиотека</h1><div class="page-sub">' +
      state.tracks.length + ' ' + plural(state.tracks.length, 'трек', 'трека', 'треков') +
      ' · ' + state.playlists.length + ' ' + plural(state.playlists.length, 'плейлист', 'плейлиста', 'плейлистов') +
    '</div></div>' +
    '<div class="page-head-actions">' +
      '<button class="btn btn-ghost btn-sm" data-action="upload-audio">' + icon('plus', 16) + ' Файл</button>' +
      '<button class="btn btn-primary btn-sm" data-action="add-url">' + icon('link', 16) + ' Ссылка</button>' +
    '</div>' +
  '</div>' +

  '<div class="tabs">' +
    tabs.map(function(t){
      return '<button class="chip' + (tab === t[0] ? ' active' : '') + '" data-action="lib-tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') +
  '</div>';

  if(tab === 'all'){
    if(!state.tracks.length){
      return html + emptyTracksHTML();
    }
    var sortOptions = [
      ['added', 'Недавно добавленные'],
      ['name', 'Название'],
      ['artist', 'Исполнитель'],
      ['duration', 'Длительность']
    ];
    html += '<div class="chip-row">' +
      sortOptions.map(function(s){
        return '<button class="chip' + (ui.librarySort === s[0] ? ' active' : '') + '" data-action="lib-sort" data-sort="' + s[0] + '">' + s[1] + '</button>';
      }).join('') + '</div>';
    html += '<div class="track-list">' +
      sortedTracks(state.tracks, ui.librarySort).map(function(t){ return trackRowHTML(t, 'all'); }).join('') +
    '</div>';
  }

  else if(tab === 'albums'){
    var albums = {};
    state.tracks.forEach(function(t){
      var key = t.album || 'Без альбома';
      if(!albums[key]) albums[key] = [];
      albums[key].push(t);
    });
    var keys = Object.keys(albums);
    if(!keys.length) return html + emptyTracksHTML();
    html += '<div class="pl-grid">' + keys.map(function(k){
      return '<div class="pl-card" data-action="nav" data-view="collection" data-type="album" data-value="' + esc(k) + '">' +
        '<div class="card-cover">' + (albums[k][0].cover
          ? '<img class="cover" src="' + albums[k][0].cover + '" alt="">'
          : '<div class="cover cover-fallback">' + icon('disc', 26) + '</div>') + '</div>' +
        '<div class="card-title">' + esc(k) + '</div>' +
        '<div class="card-sub">' + albums[k].length + ' ' + plural(albums[k].length, 'трек', 'трека', 'треков') + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  else if(tab === 'artists'){
    var artists = {};
    state.tracks.forEach(function(t){
      var key = t.artist || 'Неизвестный исполнитель';
      if(!artists[key]) artists[key] = [];
      artists[key].push(t);
    });
    var aKeys = Object.keys(artists);
    if(!aKeys.length) return html + emptyTracksHTML();
    html += '<div class="pl-grid">' + aKeys.map(function(k){
      return '<div class="pl-card" data-action="nav" data-view="collection" data-type="artist" data-value="' + esc(k) + '">' +
        '<div class="card-cover">' + (artists[k][0].cover
          ? '<img class="cover" src="' + artists[k][0].cover + '" alt="">'
          : '<div class="cover cover-fallback">' + icon('user', 26) + '</div>') + '</div>' +
        '<div class="card-title">' + esc(k) + '</div>' +
        '<div class="card-sub">' + artists[k].length + ' ' + plural(artists[k].length, 'трек', 'трека', 'треков') + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  else if(tab === 'fav'){
    var favs = state.favorites.map(getTrack).filter(Boolean);
    html += favs.length
      ? '<div class="track-list">' + favs.map(function(t){ return trackRowHTML(t, 'fav'); }).join('') + '</div>'
      : '<div class="empty"><div class="empty-ico">' + icon('heart', 30) + '</div><h3>Избранное пусто</h3><p>Нажмите ♥ рядом с треком, чтобы сохранить его здесь.</p></div>';
  }

  else if(tab === 'playlists'){
    html += state.playlists.length
      ? '<div class="pl-grid">' + state.playlists.map(playlistCardHTML).join('') + '</div>'
      : '<div class="empty"><div class="empty-ico">' + icon('playlist', 30) + '</div><h3>Создайте свой первый плейлист</h3><p>Плейлисты помогают собрать музыку под настроение.</p><button class="btn btn-primary" data-action="playlist-create">' + icon('plus', 18) + ' Создать плейлист</button></div>';
  }

  return html;
}

  '<div class="pl-hero">' +
    '<div class="pl-hero-cover" data-action="playlist-cover" data-id="' + pl.id + '">' + coverInner + '</div>' +

    return html + '<div class="empty"><div class="empty-ico">' + icon('queue', 30) + '</div>' +
      '<h3>Очередь пуста</h3><p>Нажмите на иконку очереди рядом с треком, чтобы поставить его следующим.</p></div>';
  }

  html += '<div class="track-list">' + ids.map(function(id, i){
    var t = getTrack(id);
    return '<div class="track-row" data-action="play-track" data-id="' + t.id + '" data-ctx="all">' +
      '<div class="tr-rank">' + (i + 1) + '</div>' +
      '<div class="tr-cover">' + coverHTML(t, 'cover-sm') + '</div>' +
      '<div class="tr-meta"><div class="tr-name">' + esc(t.name) + '</div><div class="tr-sub">' + esc(t.artist) + '</div></div>' +
      '<div class="tr-dur">' + fmtTime(t.duration) + '</div>' +
      '<div class="tr-tools"><button class="icon-btn" data-action="queue-remove" data-index="' + i + '">' + icon('close', 17) + '</button></div>' +
    '</div>';
  }).join('') + '</div>';

  return html;
}
