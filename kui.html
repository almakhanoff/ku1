/* ============================================================
   17. RENDER · MINI PLAYER & FULL PLAYER
   ============================================================ */
function renderMiniPlayer(){
  var t = getTrack(state.currentTrackId);
  if(!t){
    miniPlayerEl.classList.remove('visible');
    miniPlayerEl.innerHTML = '';
    return;
  }
  miniPlayerEl.classList.add('visible');
  var isMuted = audio.muted || state.settings.volume === 0;
  var durText = (t.url && (!t.duration || t.duration <= 0)) ? 'LIVE' : fmtTime(t.duration);

  miniPlayerEl.innerHTML = '' +
  '<div class="mp-bar" data-seek><div class="bar-fill" data-progress></div></div>' +
  '<div class="mp-inner">' +
    '<div class="mp-left" data-action="open-fullplayer">' +
      coverHTML(t, 'cover-sm') +
      '<div class="mp-meta">' +
        '<div class="mp-name">' + esc(t.name) + '</div>' +
        '<div class="mp-artist">' + esc(t.artist) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="mp-controls">' +
      '<button class="icon-btn" data-action="prev" title="Назад">' + icon('prev', 20) + '</button>' +
      '<button class="icon-btn play" data-action="toggle-play" title="Play/Pause">' + icon(state.isPlaying ? 'pause' : 'play', 20) + '</button>' +
      '<button class="icon-btn" data-action="next" title="Вперёд">' + icon('next', 20) + '</button>' +
    '</div>' +
    '<div class="mp-right">' +
      '<span class="time" data-curtime>0:00</span>' +
      '<div class="bar" data-seek><div class="bar-fill" data-progress></div></div>' +
      '<span class="time" data-durtime>' + durText + '</span>' +
      '<button class="icon-btn" data-action="toggle-mute" title="Звук">' + icon(isMuted ? 'mute' : 'volume', 18) + '</button>' +
      '<input class="vol" type="range" min="0" max="1" step="0.01" value="' + state.settings.volume + '" data-volume>' +
    '</div>' +
  '</div>';

  updateProgressUI();
}

function renderFullPlayer(){
  var t = getTrack(state.currentTrackId);
  if(!t){
    fullPlayerEl.innerHTML = '';
    fullPlayerEl.classList.remove('open');
    return;
  }
  if(!fullPlayerEl.classList.contains('open')) return;

  var isFav = state.favorites.indexOf(t.id) !== -1;
  var isMuted = audio.muted || state.settings.volume === 0;
  var repeatMode = state.settings.repeat;
  var durText = (t.url && (!t.duration || t.duration <= 0)) ? 'LIVE' : fmtTime(t.duration);

  fullPlayerEl.innerHTML = '' +
  '<div class="fp-head">' +
    '<button class="icon-btn" data-action="close-fullplayer" title="Закрыть">' + icon('chevDown', 24) + '</button>' +
    '<span class="fp-label">' + (t.url ? 'Онлайн-стрим' : 'Сейчас играет') + '</span>' +
    '<button class="icon-btn" data-action="track-menu" data-id="' + t.id + '" title="Ещё">' + icon('more', 22) + '</button>' +
  '</div>' +

  '<div class="fp-body">' +
    '<div class="fp-cover">' + coverHTML(t) + '</div>' +

    '<div class="fp-titles">' +
      '<h1>' + esc(t.name) + '</h1>' +
      '<p>' + esc(t.artist) + '</p>' +
    '</div>' +

    '<div class="fp-progress">' +
      '<span class="time" data-curtime>0:00</span>' +
      '<div class="bar" data-seek><div class="bar-fill" data-progress></div></div>' +
      '<span class="time" data-durtime>' + durText + '</span>' +
    '</div>' +

    '<div class="fp-controls">' +
      '<button class="icon-btn' + (state.settings.shuffle ? ' is-on' : '') + '" data-action="toggle-shuffle" title="Shuffle">' + icon('shuffle', 22) + '</button>' +
      '<button class="icon-btn" data-action="prev" title="Назад">' + icon('prev', 26) + '</button>' +
      '<button class="icon-btn play" data-action="toggle-play" title="Play/Pause">' + icon(state.isPlaying ? 'pause' : 'play', 26) + '</button>' +
      '<button class="icon-btn" data-action="next" title="Вперёд">' + icon('next', 26) + '</button>' +
      '<button class="icon-btn' + (repeatMode !== 'off' ? ' is-on' : '') + '" data-action="cycle-repeat" title="Repeat">' +
        icon(repeatMode === 'one' ? 'repeat1' : 'repeat', 22) + '</button>' +
    '</div>' +

    '<div class="fp-volume">' +
      '<button class="icon-btn" data-action="toggle-mute">' + icon(isMuted ? 'mute' : 'volume', 18) + '</button>' +
      '<input class="vol" type="range" min="0" max="1" step="0.01" value="' + state.settings.volume + '" data-volume>' +
      '<button class="icon-btn' + (isFav ? ' is-fav' : '') + '" data-action="fav-toggle" data-id="' + t.id + '" title="Избранное">' +
        icon(isFav ? 'heartFilled' : 'heart', 20) + '</button>' +
    '</div>' +
  '</div>';

  updateProgressUI();
}

function openFullPlayer(){
  if(!state.currentTrackId) return;
  fullPlayerEl.classList.add('open');
  renderFullPlayer();
}
function closeFullPlayer(){
  fullPlayerEl.classList.remove('open');
}

/* ============================================================
   18. RENDER · NAVIGATION
   ============================================================ */
const MAIN_NAV = [
  { view:'home',      label:'Главная',    icon:'home' },
  { view:'search',    label:'Поиск',      icon:'search' },
  { view:'library',   label:'Библиотека', icon:'library' },
  { view:'playlists', label:'Плейлисты',  icon:'playlist' },
  { view:'profile',   label:'Профиль',    icon:'user' }
];
const SIDE_NAV = [
  { view:'home',      label:'Главная',    icon:'home' },
  { view:'search',    label:'Поиск',      icon:'search' },
  { view:'library',   label:'Библиотека', icon:'library' },
  { view:'playlists', label:'Плейлисты',  icon:'playlist' },
  { view:'favorites', label:'Избранное',  icon:'heart' },
  { view:'history',   label:'История',    icon:'history' },
  { view:'queue',     label:'Очередь',    icon:'queue' },
  { view:'profile',   label:'Профиль',    icon:'user' },
  { view:'settings',  label:'Настройки',  icon:'settings' }
];

function navBadge(view){
  if(view === 'library') return state.tracks.length || '';
  if(view === 'playlists') return state.playlists.length || '';
  if(view === 'favorites') return state.favorites.length || '';
  if(view === 'queue') return state.queue.length || '';
  if(view === 'history') return state.history.length || '';
  return '';
}

function renderNav(){
  var active = ui.view;
  if(active === 'collection') active = 'library';
  if(active === 'playlist') active = 'playlists';

  bottomNavEl.innerHTML = MAIN_NAV.map(function(n){
    return '<button class="bn-item' + (active === n.view ? ' active' : '') + '" data-action="nav" data-view="' + n.view + '">' +
      icon(n.icon, 21) + '<span>' + n.label + '</span>' +
    '</button>';
  }).join('');

  sideNavEl.innerHTML = SIDE_NAV.map(function(n){
    var badge = navBadge(n.view);
    return '<button class="nav-item' + (active === n.view ? ' active' : '') + '" data-action="nav" data-view="' + n.view + '">' +
      icon(n.icon, 20) + '<span>' + n.label + '</span>' +
      (badge ? '<span class="nav-badge">' + badge + '</span>' : '') +
    '</button>';
  }).join('');

  topAvatar.innerHTML = state.profile.avatar
    ? '<img src="' + state.profile.avatar + '" alt="">'
    : icon('user', 19);
}

/* ============================================================
   19. RENDER · ROOT
   ============================================================ */
function renderView(){
  var html = '';
  switch(ui.view){
    case 'home':       html = viewHome(); break;
    case 'search':     html = viewSearch(); break;
    case 'library':    html = viewLibrary(); break;
    case 'playlists':  html = viewPlaylists(); break;
    case 'playlist':   html = viewPlaylistDetail(ui.params.id); break;
    case 'collection': html = viewCollection(ui.params); break;
    case 'favorites':  html = viewFavorites(); break;
    case 'history':    html = viewHistory(); break;
    case 'queue':      html = viewQueue(); break;
    case 'profile':    html = viewProfile(); break;
    case 'settings':   html = viewSettings(); break;
    default:           html = viewHome();
  }
  viewRoot.innerHTML = html;
  updateProgressUI();
}

function updateRowHighlights(){
  var rows = viewRoot.querySelectorAll('.track-row[data-id]');
  rows.forEach(function(row){
    var id = row.getAttribute('data-id');
    var isCur = id === state.currentTrackId;
    row.classList.toggle('is-current', isCur);
    var coverBox = row.querySelector('.tr-cover');
    if(!coverBox) return;
    var eq = coverBox.querySelector('.eq');
    if(isCur && state.isPlaying && !eq){
      var span = document.createElement('span');
      span.className = 'eq';
      span.innerHTML = '<i></i><i></i><i></i>';
      coverBox.appendChild(span);
    }else if((!isCur || !state.isPlaying) && eq){
      eq.remove();
    }
  });
}

function render(opts){
  opts = opts || {};
  renderNav();
  renderView();
  renderMiniPlayer();
  renderFullPlayer();
  if(!opts.keepScroll) viewRoot.scrollTop = 0;
}

function navigate(view, params){
  ui.view = view;
  ui.params = params || {};
  render();
}

/* ============================================================
   20. PLAYLIST ACTIONS
   ============================================================ */
async function createPlaylist(){
  var name = await promptDialog('Новый плейлист', '', 'Например: Workout', 'Создать');
  if(!name) return;
  var pl = { id: uid(), name: name, cover: '', trackIds: [], createdAt: Date.now() };
  state.playlists.push(pl);
  saveStateNow();
  toast('Плейлист «' + name + '» создан', 'success');
  navigate('playlist', { id: pl.id });
}

async function renamePlaylist(id){
  var pl = state.playlists.find(function(p){ return p.id === id; });
  if(!pl) return;
  var name = await promptDialog('Переименовать плейлист', pl.name, 'Название', 'Сохранить');
  if(!name) return;
  pl.name = name;
  saveStateNow();
  render();
  toast('Плейлист переименован', 'success');
}

async function deletePlaylist(id){
  var pl = state.playlists.find(function(p){ return p.id === id; });
  if(!pl) return;
  var ok = await confirmDialog('Удалить плейлист?', '«' + pl.name + '» будет удалён. Треки останутся в библиотеке.', 'Удалить', true);
  if(!ok) return;
  state.playlists = state.playlists.filter(function(p){ return p.id !== id; });
  saveStateNow();
  toast('Плейлист удалён');
  navigate('playlists');
}

function openPlaylistMenu(id){
  var pl = state.playlists.find(function(p){ return p.id === id; });
  if(!pl) return;
  openModal(
    '<h3 class="modal-title">' + esc(pl.name) + '</h3>' +
    '<div class="modal-list">' +
      '<button class="modal-item" data-pm="play">' + icon('play', 20) + ' Слушать</button>' +
      '<button class="modal-item" data-pm="add">' + icon('plus', 20) + ' Добавить треки</button>' +
      '<button class="modal-item" data-pm="cover">' + icon('image', 20) + ' Сменить обложку</button>' +
      '<button class="modal-item" data-pm="rename">' + icon('edit', 20) + ' Переименовать</button>' +
      '<button class="modal-item danger" data-pm="delete">' + icon('trash', 20) + ' Удалить плейлист</button>' +
    '</div>'
  );
  modalRoot.querySelectorAll('[data-pm]').forEach(function(btn){
    btn.onclick = function(){
      var a = btn.getAttribute('data-pm');
      closeModal();
      if(a === 'play') playPlaylist(id);
      else if(a === 'add') openAddTracksModal(id);
      else if(a === 'cover'){ ui.playlistPick = id; plCoverInput.click(); }
      else if(a === 'rename') renamePlaylist(id);
      else if(a === 'delete') deletePlaylist(id);
    };
  });
}

function playPlaylist(id){
  var pl = state.playlists.find(function(p){ return p.id === id; });
  if(!pl) return;
  var ids = pl.trackIds.filter(function(tid){ return !!getTrack(tid); });
  if(!ids.length){ toast('В плейлисте нет треков', 'error'); return; }
  playContext = ids;
  playIndex = 0;
  loadTrack(ids[0], true);
}

function openAddTracksModal(playlistId){
  var pl = state.playlists.find(function(p){ return p.id === playlistId; });
  if(!pl) return;

  if(!state.tracks.length){
    openModal('<h3 class="modal-title">Нет треков</h3><p style="color:var(--muted);font-size:14px">Сначала добавьте музыку в библиотеку.</p>' +
      '<div class="modal-actions"><button class="btn btn-primary" id="addGoUpload">Добавить музыку</button></div>');
    document.getElementById('addGoUpload').onclick = function(){ closeModal(); audioInput.click(); };
    return;
  }

  var items = state.tracks.map(function(t){
    var inPl = pl.trackIds.indexOf(t.id) !== -1;
    return '<button class="modal-item" data-add-track="' + t.id + '">' +
      '<span class="mi-ico">' + (inPl ? icon('check', 18) : icon('plus', 18)) + '</span>' +
      '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(t.name) + '</span>' +
      '<span style="color:var(--muted);font-size:12px;flex:0 0 auto">' + esc(t.artist) + '</span>' +
    '</button>';
  }).join('');

  openModal(
    '<h3 class="modal-title">Добавить в «' + esc(pl.name) + '»</h3>' +
    '<div class="modal-list">' + items + '</div>' +
    '<div class="modal-actions"><button class="btn btn-ghost" id="addDone">Готово</button></div>'
  );

  modalRoot.querySelectorAll('[data-add-track]').forEach(function(btn){
    btn.onclick = function(){
      var tid = btn.getAttribute('data-add-track');
      var idx = pl.trackIds.indexOf(tid);
      if(idx === -1){
        pl.trackIds.push(tid);
        btn.querySelector('.mi-ico').innerHTML = icon('check', 18);
        toast('Трек добавлен в плейлист', 'success');
      }else{
        pl.trackIds.splice(idx, 1);
        btn.querySelector('.mi-ico').innerHTML = icon('plus', 18);
        toast('Трек удалён из плейлиста');
      }
      saveStateNow();
    };
  });
  document.getElementById('addDone').onclick = function(){
    closeModal();
    render();
  };
}

async function removeTrackFromPlaylist(playlistId, trackId){
  var pl = state.playlists.find(function(p){ return p.id === playlistId; });
  if(!pl) return;
  pl.trackIds = pl.trackIds.filter(function(id){ return id !== trackId; });
  saveStateNow();
  render();
  toast('Трек удалён из плейлиста');
}

/* ============================================================
   21. TRACK ACTIONS
   ============================================================ */
function toggleFavorite(trackId){
  var idx = state.favorites.indexOf(trackId);
  if(idx === -1){
    state.favorites.push(trackId);
    toast('Добавлено в избранное', 'success');
  }else{
    state.favorites.splice(idx, 1);
    toast('Удалено из избранного');
  }
  saveStateNow();
  render({ keepScroll: true });
  renderFullPlayer();
}

function openTrackMenu(trackId){
  var t = getTrack(trackId);
  if(!t) return;
  var isFav = state.favorites.indexOf(trackId) !== -1;
  var inPlaylistView = ui.view === 'playlist';

  openModal(
    '<div class="modal-track">' +
      '<div style="width:56px;height:56px;border-radius:12px;overflow:hidden;flex:0 0 auto">' + coverHTML(t) + '</div>' +
      '<div style="min-width:0">' +
        '<div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(t.name) + '</div>' +
        '<div style="color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
          esc(t.artist) + (t.url ? ' · онлайн' : '') + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-list">' +
      '<button class="modal-item" data-tm="play">' + icon('play', 20) + ' Воспроизвести</button>' +
      '<button class="modal-item" data-tm="queue">' + icon('queue', 20) + ' Добавить в очередь</button>' +
      '<button class="modal-item" data-tm="fav">' + icon(isFav ? 'heartFilled' : 'heart', 20) + (isFav ? ' Убрать из избранного' : ' Добавить в избранное') + '</button>' +
      '<button class="modal-item" data-tm="playlist">' + icon('playlist', 20) + ' Добавить в плейлист</button>' +
      '<button class="modal-item" data-tm="cover">' + icon('image', 20) + ' Загрузить обложку</button>' +
      (t.cover ? '<button class="modal-item" data-tm="cover-remove">' + icon('close', 20) + ' Удалить обложку</button>' : '') +
      (t.url ? '<button class="modal-item" data-tm="edit-meta">' + icon('edit', 20) + ' Изменить название/исполнителя</button>' : '') +
      (inPlaylistView ? '<button class="modal-item danger" data-tm="remove-pl">' + icon('trash', 20) + ' Удалить из плейлиста</button>' : '') +
      '<button class="modal-item danger" data-tm="delete">' + icon('trash', 20) + ' Удалить трек</button>' +
    '</div>'
  );

  modalRoot.querySelectorAll('[data-tm]').forEach(function(btn){
    btn.onclick = function(){
      var a = btn.getAttribute('data-tm');
      closeModal();
      if(a === 'play'){
        playTrackById(trackId, 'all');
      }else if(a === 'queue'){
        addToQueue(trackId);
      }else if(a === 'fav'){
        toggleFavorite(trackId);
      }else if(a === 'playlist'){
        openPickPlaylistModal(trackId);
      }else if(a === 'cover'){
        ui.playlistPick = null;
        coverInput.dataset.trackId = trackId;
        coverInput.click();
      }else if(a === 'cover-remove'){
        t.cover = '';
        saveStateNow();
        render({ keepScroll: true });
        toast('Обложка удалена');
      }else if(a === 'edit-meta'){
        editOnlineTrackMeta(trackId);
      }else if(a === 'remove-pl'){
        removeTrackFromPlaylist(ui.params.id, trackId);
      }else if(a === 'delete'){
        deleteTrack(trackId);
      }
    };
  });
}

async function editOnlineTrackMeta(trackId){
  var t = getTrack(trackId);
  if(!t) return;
  openModal(
    '<h3 class="modal-title">Метаданные трека</h3>' +
    '<div class="form-row"><label>Название</label>' +
      '<input class="input" id="tmName" value="' + esc(t.name) + '" maxlength="120"></div>' +
    '<div class="form-row"><label>Исполнитель</label>' +
      '<input class="input" id="tmArtist" value="' + esc(t.artist) + '" maxlength="80"></div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="tmCancel">Отмена</button>' +
      '<button class="btn btn-primary" id="tmOk">Сохранить</button>' +
    '</div>'
  );
  document.getElementById('tmCancel').onclick = closeModal;
  document.getElementById('tmOk').onclick = function(){
    var n = document.getElementById('tmName').value.trim();
    var a = document.getElementById('tmArtist').value.trim();
    t.name = n || t.name;
    t.artist = a || t.artist;
    saveStateNow();
    closeModal();
    render({ keepScroll: true });
    renderMiniPlayer();
    renderFullPlayer();
    toast('Сохранено', 'success');
  };
}

function openPickPlaylistModal(trackId){
  if(!state.playlists.length){
    openModal(
      '<h3 class="modal-title">Нет плейлистов</h3>' +
      '<p style="color:var(--muted);font-size:14px">Создайте первый плейлист, чтобы добавлять в него треки.</p>' +
      '<div class="modal-actions"><button class="btn btn-primary" id="pkCreate">Создать плейлист</button></div>'
    );
    document.getElementById('pkCreate').onclick = function(){ closeModal(); createPlaylist(); };
    return;
  }
  openModal(
    '<h3 class="modal-title">Добавить в плейлист</h3>' +
    '<div class="modal-list">' +
      state.playlists.map(function(p){
        return '<button class="modal-item" data-pk="' + p.id + '">' + icon('playlist', 20) +
          '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.name) + '</span>' +
          '<span style="color:var(--muted);font-size:12px;flex:0 0 auto">' + p.trackIds.length + '</span></button>';
      }).join('') +
    '</div>' +
    '<div class="modal-actions"><button class="btn btn-ghost" id="pkNew">' + icon('plus', 16) + ' Новый плейлист</button></div>'
  );
  modalRoot.querySelectorAll('[data-pk]').forEach(function(btn){
    btn.onclick = function(){
      var pid = btn.getAttribute('data-pk');
      var pl = state.playlists.find(function(p){ return p.id === pid; });
      if(!pl) return;
      if(pl.trackIds.indexOf(trackId) === -1){
        pl.trackIds.push(trackId);
        saveStateNow();
        toast('Добавлено в «' + pl.name + '»', 'success');
      }else{
        toast('Трек уже в этом плейлисте');
      }
      closeModal();
      render({ keepScroll: true });
    };
  });
  document.getElementById('pkNew').onclick = function(){
    closeModal();
    createPlaylist();
  };
}

async function deleteTrack(trackId){
  var t = getTrack(trackId);
  if(!t) return;
  var ok = await confirmDialog('Удалить трек?', '«' + t.name + '» будет удалён из библиотеки и всех плейлистов.', 'Удалить', true);
  if(!ok) return;

  /* Удаляем blob только если это локальный файл */
  if(!t.url){
    await fileDel(trackId);
  }

  state.tracks = state.tracks.filter(function(x){ return x.id !== trackId; });
  state.favorites = state.favorites.filter(function(id){ return id !== trackId; });
  state.queue = state.queue.filter(function(id){ return id !== trackId; });
  state.history = state.history.filter(function(h){ return h.id !== trackId; });
  state.playlists.forEach(function(p){
    p.trackIds = p.trackIds.filter(function(id){ return id !== trackId; });
  });

  if(state.currentTrackId === trackId){
    audio.pause();
    audio.removeAttribute('src');
    if(currentObjectUrl){
      try{ URL.revokeObjectURL(currentObjectUrl); }catch(e){}
      currentObjectUrl = null;
    }
    state.currentTrackId = null;
    state.isPlaying = false;
    renderMiniPlayer();
    renderFullPlayer();
  }

  saveStateNow();
  render();
  toast('Трек удалён');
}

/* ============================================================
   22. QUEUE ACTIONS
   ============================================================ */
function addToQueue(trackId){
  if(!getTrack(trackId)) return;
  state.queue.push(trackId);
  saveStateNow();
  renderNav();
  if(ui.view === 'queue' || ui.view === 'home') renderView();
  toast('Добавлено в очередь', 'success');
}

/* ============================================================
   23. HISTORY / DATA ACTIONS
   ============================================================ */
async function clearHistory(){
  if(!state.history.length){ toast('История уже пуста'); return; }
  var ok = await confirmDialog('Очистить историю?', 'Все записи прослушивания будут удалены.', 'Очистить', true);
  if(!ok) return;
  state.history = [];
  saveStateNow();
  render();
  toast('История очищена', 'success');
}

async function clearLibrary(){
  if(!state.tracks.length && !state.playlists.length){ toast('Библиотека уже пуста'); return; }
  var ok = await confirmDialog('Очистить библиотеку?', 'Все треки, обложки и плейлисты будут удалены. Действие необратимо.', 'Очистить', true);
  if(!ok) return;

  audio.pause();
  audio.removeAttribute('src');
  if(currentObjectUrl){
    try{ URL.revokeObjectURL(currentObjectUrl); }catch(e){}
    currentObjectUrl = null;
  }

  await fileClear();
  state.tracks = [];
  state.playlists = [];
  state.favorites = [];
  state.queue = [];
  state.history = [];
  state.currentTrackId = null;
  state.isPlaying = false;

  saveStateNow();
  render();
  toast('Библиотека очищена', 'success');
}

async function resetApp(){
  var ok = await confirmDialog(
    'Сбросить приложение?',
    'Будут удалены ВСЕ локальные данные: треки, плейлисты, избранное, история, профиль и настройки.',
    'Сбросить всё',
    true
  );
  if(!ok) return;

  audio.pause();
  audio.removeAttribute('src');
  if(currentObjectUrl){
    try{ URL.revokeObjectURL(currentObjectUrl); }catch(e){}
    currentObjectUrl = null;
  }

  await fileClear();
  try{ localStorage.removeItem(LS_KEY); }catch(e){}

  state = defaultState();
  audio.volume = state.settings.volume;
  playContext = [];
  playIndex = -1;
  ui.searchQuery = '';
  globalSearch.value = '';

  applyTheme();
  saveStateNow();
  navigate('home');
  toast('Приложение сброшено', 'success');
}

/* ============================================================
   24. THEME
   ============================================================ */
function applyTheme(){
  document.body.classList.toggle('light', state.settings.theme === 'light');
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', state.settings.theme === 'light' ? '#eef2f1' : '#080a09');
}

/* ============================================================
   25. EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-action]') : null;
  if(!el) return;
  var action = el.getAttribute('data-action');

  switch(action){

    case 'nav': {
      var v = el.getAttribute('data-view');
      if(v === 'collection'){
        navigate('collection', {
          type: el.getAttribute('data-type'),
          value: el.getAttribute('data-value')
        });
      }else{
        navigate(v);
      }
      break;
    }

    case 'upload-audio': audioInput.click(); break;
    case 'add-url': openAddUrlModal(); break;

    case 'play-track':
      e.stopPropagation();
      playTrackById(el.getAttribute('data-id'), el.getAttribute('data-ctx') || 'all');
      break;
    case 'toggle-play': togglePlay(); break;
    case 'next': nextTrack(false); break;
    case 'prev': prevTrack(); break;
    case 'open-fullplayer': openFullPlayer(); break;
    case 'close-fullplayer': closeFullPlayer(); break;

    case 'toggle-shuffle': {
      state.settings.shuffle = !state.settings.shuffle;
      saveStateNow();
      renderMiniPlayer();
      renderFullPlayer();
      if(ui.view === 'settings') renderView();
      toast(state.settings.shuffle ? 'Shuffle включён' : 'Shuffle выключен');
      break;
    }
    case 'cycle-repeat': {
      var order = ['off', 'all', 'one'];
      var cur = order.indexOf(state.settings.repeat);
      state.settings.repeat = order[(cur + 1) % order.length];
      saveStateNow();
      renderMiniPlayer();
      renderFullPlayer();
      if(ui.view === 'settings') renderView();
      var labels = { off:'Repeat выключен', all:'Повтор всех треков', one:'Повтор одного трека' };
      toast(labels[state.settings.repeat]);
      break;
    }
    case 'set-repeat': {
      state.settings.repeat = el.getAttribute('data-repeat');
      saveStateNow();
      renderFullPlayer();
      renderView();
      break;
    }
    case 'toggle-autoplay': {
      state.settings.autoplay = !state.settings.autoplay;
      saveStateNow();
      renderView();
      toast(state.settings.autoplay ? 'Автозапуск включён' : 'Автозапуск выключен');
      break;
    }
    case 'toggle-mute': {
      audio.muted = !audio.muted;
      renderMiniPlayer();
      renderFullPlayer();
      break;
    }

    case 'play-context': {
      var ctx = el.getAttribute('data-ctx');
      var ids = getContextList(ctx);
      if(!ids.length){ toast('Нет треков для воспроизведения', 'error'); break; }
      playContext = ids;
      playIndex = 0;
      loadTrack(ids[0], true);
      break;
    }
    case 'play-collection': {
      var type = el.getAttribute('data-type');
      var value = el.getAttribute('data-value');
      var ids2 = getContextList(type + ':' + value);
      if(!ids2.length){ toast('Нет треков', 'error'); break; }
      playContext = ids2;
      playIndex = 0;
      loadTrack(ids2[0], true);
      break;
    }
    case 'play-playlist': playPlaylist(el.getAttribute('data-id')); break;

    case 'fav-toggle':
      e.stopPropagation();
      toggleFavorite(el.getAttribute('data-id'));
      break;
    case 'queue-add':
      e.stopPropagation();
      addToQueue(el.getAttribute('data-id'));
      break;
    case 'track-menu':
      e.stopPropagation();
      openTrackMenu(el.getAttribute('data-id'));
      break;
    case 'queue-remove': {
      var idx = parseInt(el.getAttribute('data-index'), 10);
      state.queue.splice(idx, 1);
      saveStateNow();
      renderView();
      renderNav();
      break;
    }
    case 'queue-clear': {
      state.queue = [];
      saveStateNow();
      render();
      toast('Очередь очищена');
      break;
    }
    case 'queue-play': {
      if(!state.queue.length){ toast('Очередь пуста', 'error'); break; }
      nextTrack(false);
      navigate('home');
      break;
    }

    case 'playlist-create': createPlaylist(); break;
    case 'open-playlist': navigate('playlist', { id: el.getAttribute('data-id') }); break;
    case 'playlist-menu': openPlaylistMenu(el.getAttribute('data-id')); break;
    case 'playlist-add-tracks': openAddTracksModal(el.getAttribute('data-id')); break;
    case 'playlist-cover': {
      ui.playlistPick = el.getAttribute('data-id');
      plCoverInput.click();
      break;
    }

    case 'lib-tab': {
      ui.libraryTab = el.getAttribute('data-tab');
      renderView();
      viewRoot.scrollTop = 0;
      break;
    }
    case 'lib-sort': {
      ui.librarySort = el.getAttribute('data-sort');
      renderView();
      break;
    }

    case 'history-clear': clearHistory(); break;

    case 'avatar-upload': avatarInput.click(); break;
    case 'avatar-remove':
      state.profile.avatar = '';
      saveStateNow();
      render();
      toast('Аватар удалён');
      break;

    case 'theme': {
      state.settings.theme = el.getAttribute('data-theme');
      applyTheme();
      saveStateNow();
      renderView();
      break;
    }
    case 'library-clear': clearLibrary(); break;
    case 'app-reset': resetApp(); break;
  }
});

/* ============================================================
   26. INPUT / CHANGE EVENTS
   ============================================================ */
document.addEventListener('input', function(e){
  if(e.target.matches && e.target.matches('[data-volume]')){
    setVolume(parseFloat(e.target.value));
    return;
  }

  if(e.target === globalSearch){
    ui.searchQuery = globalSearch.value;
    if(ui.view !== 'search'){
      navigate('search');
      var si = document.getElementById('searchInput');
      if(si) si.value = ui.searchQuery;
    }else{
      var si2 = document.getElementById('searchInput');
      if(si2 && si2.value !== ui.searchQuery) si2.value = ui.searchQuery;
      updateSearchResults();
    }
    return;
  }

  if(e.target.id === 'searchInput'){
    ui.searchQuery = e.target.value;
    globalSearch.value = ui.searchQuery;
    updateSearchResults();
    return;
  }

  if(e.target.id === 'profileName'){
    state.profile.name = e.target.value;
    saveStateNow();
    renderNav();
    return;
  }
  if(e.target.id === 'profileGenre'){
    state.profile.genre = e.target.value;
    saveStateNow();
    return;
  }
});

/* ============================================================
   27. FILE INPUT HANDLERS
   ============================================================ */
audioInput.addEventListener('change', function(){
  handleAudioFiles(audioInput.files);
  audioInput.value = '';
});

coverInput.addEventListener('change', async function(){
  var file = coverInput.files && coverInput.files[0];
  var trackId = coverInput.dataset.trackId;
  coverInput.value = '';
  coverInput.dataset.trackId = '';
  if(!file || !trackId) return;

  if(!file.type || file.type.indexOf('image/') !== 0){
    toast('Выберите файл изображения', 'error');
    return;
  }
  try{
    var dataUrl = await resizeImage(file, 420);
    var t = getTrack(trackId);
    if(!t) return;
    t.cover = dataUrl;
    saveStateNow();
    render({ keepScroll: true });
    renderFullPlayer();
    toast('Обложка обновлена', 'success');
  }catch(err){
    toast('Не удалось обработать изображение', 'error');
  }
});

plCoverInput.addEventListener('change', async function(){
  var file = plCoverInput.files && plCoverInput.files[0];
  var plId = ui.playlistPick;
  plCoverInput.value = '';
  ui.playlistPick = null;
  if(!file || !plId) return;
  if(!file.type || file.type.indexOf('image/') !== 0){
    toast('Выберите файл изображения', 'error');
    return;
  }
  try{
    var dataUrl = await resizeImage(file, 420);
    var pl = state.playlists.find(function(p){ return p.id === plId; });
    if(!pl) return;
    pl.cover = dataUrl;
    saveStateNow();
    render({ keepScroll: true });
    toast('Обложка плейлиста обновлена', 'success');
  }catch(err){
    toast('Не удалось обработать изображение', 'error');
  }
});

avatarInput.addEventListener('change', async function(){
  var file = avatarInput.files && avatarInput.files[0];
  avatarInput.value = '';
  if(!file) return;
  if(!file.type || file.type.indexOf('image/') !== 0){
    toast('Выберите файл изображения', 'error');
    return;
  }
  try{
    var dataUrl = await resizeImage(file, 240);
    state.profile.avatar = dataUrl;
    saveStateNow();
    render();
    toast('Аватар обновлён', 'success');
  }catch(err){
    toast('Не удалось обработать изображение', 'error');
  }
});

/* ============================================================
   28. GLOBAL KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if(e.code === 'Space'){
    e.preventDefault();
    togglePlay();
  }else if(e.code === 'ArrowRight' && e.shiftKey){
    nextTrack(false);
  }else if(e.code === 'ArrowLeft' && e.shiftKey){
    prevTrack();
  }else if(e.code === 'Escape'){
    if(fullPlayerEl.classList.contains('open')) closeFullPlayer();
  }
});

/* ============================================================
   29. INIT
   ============================================================ */
function init(){
  loadState();
  state.isPlaying = false;
  applyTheme();
  audio.volume = clamp(state.settings.volume, 0, 1);

  if(state.currentTrackId && getTrack(state.currentTrackId)){
    playContext = state.tracks.map(function(t){ return t.id; });
    playIndex = playContext.indexOf(state.currentTrackId);
  }

  render();
  renderMiniPlayer();

  if(!('indexedDB' in window)){
    console.warn('KUI: IndexedDB недоступен — локальные файлы будут храниться только до перезагрузки.');
  }

  if(!state.tracks.length && !localStorage.getItem('kui_visited')){
    try{ localStorage.setItem('kui_visited', '1'); }catch(e){}
    setTimeout(function(){
      toast('Добро пожаловать в KUI! Добавьте музыку файлом или по ссылке.', 'success');
    }, 700);
  }

  window.addEventListener('beforeunload', saveStateNow);
}

init();
</script>
